<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you 💐</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#fff9f6;--bg2:#ffe3ec;--fg:#4a3b40;--accent:#d9667f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1d24;--bg2:#150f13;--fg:#f4e6ea;--accent:#f08ba2}}
:root[data-theme="dark"]{--bg1:#2a1d24;--bg2:#150f13;--fg:#f4e6ea;--accent:#f08ba2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 30%,var(--bg1),var(--bg2));color:var(--fg);font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-sizing:border-box;overflow-x:hidden}
svg{width:min(88vw,380px);height:auto;overflow:visible}
.stem{fill:none;stroke:#4f9162;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.4s ease-out forwards}
.fade{opacity:0;animation:fade .9s ease-out forwards}
.bloom{transform-box:fill-box;transform-origin:center;transform:scale(0) rotate(-40deg);animation:pop 1.1s cubic-bezier(.2,1.35,.4,1) forwards}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 6s ease-in-out 3.4s infinite}
.tw{opacity:0;animation:tw 2.8s ease-in-out infinite}
.glow{opacity:0;animation:fade 2s ease-out .6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1) rotate(0)}}
@keyframes fade{to{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.2deg)}}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:.95;transform:scale(1)}}
button{margin-top:14px;font:600 1.05rem 'Nunito',sans-serif;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:12px 28px;cursor:pointer;opacity:0;animation:fade .8s ease-out 3s forwards;box-shadow:0 4px 14px rgba(217,102,127,.4)}
button:active{transform:scale(.96)}
#reveal{max-width:420px;margin-top:6px}
#to{font-size:1.15rem;opacity:0;transition:opacity 1.2s}
#name{font:600 2.6rem 'Dancing Script',cursive;color:var(--accent);margin:6px 0 12px;opacity:0;transition:opacity 1.2s}
#msg p{margin:0 0 10px;line-height:1.6;opacity:0;transform:translateY(8px);transition:opacity 1s,transform 1s}
.show{opacity:1!important;transform:none!important}
.fp{position:fixed;top:-24px;width:14px;height:18px;border-radius:150% 0 150% 0;pointer-events:none;opacity:.85;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(var(--rot))}}
</style>
</head>
<body>
<svg id="art" viewBox="0 0 300 370" aria-label="A bouquet of flowers"></svg>
<button id="btn">Click here 💛</button>
<div id="reveal"><div id="to">To my Bsf,</div><div id="name"></div><div id="msg"></div></div>

<script>
/* ===== EDIT THESE ===== */
const CONFIG = {
  name: "Sohini ❤️",
  message: [
    "I know you’ve been going through a lot lately, and life hasn’t been easy on you. But hey, don’t lose hope. I truly believe that things will get better, one day at a time.",
    "I want you to know that I believe in you, more than you know. You’re one of the strongest people I know, and I’m sure you’ll find your way through all these difficult moments.",
    "And remember, you don’t have to face everything alone. I’ll be right here, through your ups and downs, through the good days and the bad ones. Whenever you need someone to talk to, someone to listen, or simply someone to sit beside you, I’ll be there.",
    "Take your time, breathe, and allow yourself to heal. There’s no need to rush anything. Better days are waiting for you, and I genuinely hope life gives you all the happiness and peace you deserve.",
    "With lots and lots of love,",
    "Yours, Saggy 🤍"
  ],
  /* type: peony | lily | orchid | carnation ; petal = main color, base = deeper shade at the petal root */
  flowers: [
    {x:150,y:62, r:38,type:"peony",    petal:"#ffd3e1",base:"#ee8fb0",center:"#f3a6bd"},
    {x:86, y:94, r:32,type:"lily",     petal:"#ffffff",base:"#d8e8a0",center:"#f2a33a"},
    {x:214,y:94, r:32,type:"orchid",   petal:"#b57be6",base:"#6d2fa8",center:"#7b2fb5"},
    {x:46, y:150,r:28,type:"carnation",petal:"#ff7fb0",base:"#c42a69",center:"#d6336f"},
    {x:254,y:150,r:28,type:"peony",    petal:"#ffd3e1",base:"#ee8fb0",center:"#f3a6bd"},
    {x:116,y:128,r:30,type:"carnation",petal:"#ff7fb0",base:"#c42a69",center:"#d6336f"},
    {x:186,y:128,r:30,type:"lily",     petal:"#ffffff",base:"#d8e8a0",center:"#f2a33a"},
    {x:150,y:180,r:30,type:"orchid",   petal:"#b57be6",base:"#6d2fa8",center:"#7b2fb5"}
  ]
};
/* ====================== */
const svg=document.getElementById('art'),B={x:150,y:315};
const sh=(h,a)=>{const n=parseInt(h.slice(1),16),f=c=>Math.max(0,Math.min(255,Math.round(a<0?c*(1+a):c+(255-c)*a)));return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`};
const P=(w,h)=>`M0 0C${-w} ${-h*.3} ${-w*.95} ${-h*.9} 0 ${-h}C${w*.95} ${-h*.9} ${w} ${-h*.3} 0 0Z`;
const L=(w,h)=>`M0 0C${-w} ${-h*.25} ${-w*.5} ${-h*.75} 0 ${-h}C${w*.5} ${-h*.75} ${w} ${-h*.25} 0 0Z`;
const R=(w,h)=>{let d=`M0 0L${-w} ${-h*.6}`;for(let k=0;k<5;k++){const a=-w+2*w*(k+.5)/5,b=-w+2*w*(k+1)/5;d+=`Q${a} ${-h*1.15} ${b} ${-h*.6}`}return d+'Z'};
let defs=`<filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.6" flood-color="#000" flood-opacity=".25"/></filter>
<radialGradient id="glow"><stop offset="0" stop-color="#ffb6cb" stop-opacity=".6"/><stop offset="1" stop-color="#ffb6cb" stop-opacity="0"/></radialGradient>
<linearGradient id="lg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f7a4a"/><stop offset="1" stop-color="#7cc48a"/></linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe0e8"/><stop offset="1" stop-color="#f2a9bd"/></linearGradient>`;
const order=CONFIG.flowers.map((f,i)=>({...f,i})).sort((a,b)=>a.y-b.y);
let leaves='',stems='',blooms='',fill='';
[-62,-46,-30,-14,14,30,46,62].forEach((a,k)=>{const h=205-Math.abs(a)*1.5;
  leaves+=`<g transform="translate(${B.x} ${B.y-14}) rotate(${a})"><path class="fade" style="animation-delay:${.9+k*.05}s" d="${L(20,h)}" fill="url(#lg)" stroke="rgba(0,60,20,.25)" stroke-width=".8"/><path class="fade" style="animation-delay:${.9+k*.05}s" d="M0 0L0 ${-h*.85}" stroke="rgba(255,255,255,.35)" stroke-width="1" fill="none"/></g>`});
[[28,110],[272,110],[62,52],[238,52],[12,196],[288,196]].forEach(([x,y],k)=>{
  fill+=`<path class="stem" style="animation-delay:${1+k*.1}s;stroke-width:1.4" d="M${B.x} ${B.y-6}Q${(x+B.x)/2} ${y+60} ${x} ${y}"/>`;
  for(let j=0;j<6;j++){const a=j*60+k*17,d=j%2?7:4;fill+=`<circle class="fade" style="animation-delay:${1.8+k*.08}s" cx="${x+Math.cos(a*Math.PI/180)*d}" cy="${y+Math.sin(a*Math.PI/180)*d}" r="${2.6-j%2*.6}" fill="#fff" stroke="rgba(0,0,0,.1)" stroke-width=".5"/>`}});
order.forEach((f,n)=>{
  const {r,i}=f;
  defs+=`<linearGradient id="pg${i}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${f.base}"/><stop offset=".6" stop-color="${f.petal}"/><stop offset="1" stop-color="${sh(f.petal,.12)}"/></linearGradient>`;
  const ring=(c,o,d)=>{let s='';for(let a=0;a<c;a++)s+=`<path d="${d}" fill="url(#pg${i})" stroke="rgba(0,0,0,.13)" stroke-width=".8" transform="rotate(${a*360/c+o})"/>`;return s};
  let s='';
  if(f.type==='peony'){s=ring(9,0,P(r*.46,r))+ring(8,20,P(r*.4,r*.84))+ring(7,8,P(r*.34,r*.64))+ring(6,30,P(r*.28,r*.44))+ring(5,0,P(r*.2,r*.26))+`<circle r="${r*.14}" fill="${f.center}" opacity=".8"/>`}
  else if(f.type==='carnation'){s=ring(14,0,R(r*.36,r))+ring(12,13,R(r*.3,r*.78))+ring(10,7,R(r*.24,r*.56))+ring(8,20,R(r*.18,r*.34))+`<circle r="${r*.1}" fill="${f.center}"/>`}
  else if(f.type==='lily'){s=ring(3,60,L(r*.32,r))+ring(3,0,L(r*.32,r*.96));
    for(let a=0;a<3;a++)s+=`<path d="M0 0L0 ${-r*.72}" stroke="rgba(150,175,80,.55)" stroke-width="1.2" transform="rotate(${a*120})"/>`;
    for(let a=0;a<6;a++)s+=`<g transform="rotate(${a*60+20})"><path d="M0 0L0 ${-r*.42}" stroke="#a9c25e" stroke-width="1.2"/><ellipse cy="${-r*.45}" rx="${r*.04}" ry="${r*.09}" fill="${f.center}"/></g>`;
    s+=`<circle r="${r*.07}" fill="#8bbf6a"/>`}
  else {s=ring(3,0,P(r*.2,r*.78));
    s+=`<path d="${P(r*.45,r*.82)}" fill="url(#pg${i})" stroke="rgba(60,0,90,.25)" stroke-width=".8" transform="rotate(-72)"/><path d="${P(r*.45,r*.82)}" fill="url(#pg${i})" stroke="rgba(60,0,90,.25)" stroke-width=".8" transform="rotate(72)"/>`;
    s+=`<path d="M0 0C${-r*.38} ${r*.05} ${-r*.3} ${r*.52} 0 ${r*.58}C${r*.3} ${r*.52} ${r*.38} ${r*.05} 0 0Z" fill="${f.center}" stroke="rgba(255,255,255,.35)" stroke-width=".8"/>`;
    s+=`<path d="M0 ${r*.1}L0 ${r*.45}M${-r*.1} ${r*.15}L${-r*.14} ${r*.4}M${r*.1} ${r*.15}L${r*.14} ${r*.4}" stroke="#e9b3ff" stroke-width="1"/><circle cy="${-r*.03}" r="${r*.1}" fill="#fff3b0"/>`}
  const cx=(f.x+B.x)/2+(f.x<B.x?-14:14),cy=(f.y+B.y)/2+16;
  stems+=`<path class="stem" style="animation-delay:${n*.08}s" d="M${B.x} ${B.y-6}Q${cx} ${cy} ${f.x} ${f.y+r*.4}"/>`;
  blooms+=`<g transform="translate(${f.x} ${f.y})"><g class="bloom" filter="url(#sh)" style="animation-delay:${.5+n*.2}s">${s}</g></g>`;
});
const wrap=`<g class="fade" style="animation-delay:1.6s"><path d="M86 238L214 238L176 352L124 352Z" fill="url(#paper)" stroke="rgba(150,40,80,.25)"/><path d="M112 238L150 352L124 352Z" fill="rgba(255,255,255,.35)"/><path d="M188 238L150 352L176 352Z" fill="rgba(150,40,80,.12)"/><path d="M86 238Q150 262 214 238" fill="none" stroke="rgba(150,40,80,.3)"/></g>
<g class="fade" style="animation-delay:1.9s"><path d="M150 304C112 280 112 326 150 308C188 326 188 280 150 304Z" fill="#d9667f" stroke="rgba(100,0,40,.3)"/><path d="M150 308L128 346M150 308L172 346" stroke="#d9667f" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="306" r="7" fill="#c24a68"/></g>`;
let sp='';[[20,40],[280,30],[8,120],[292,110],[40,230],[262,240],[150,8],[100,20],[200,16],[30,300],[270,310]].forEach(([x,y],k)=>{sp+=`<path class="tw" style="animation-delay:${3+k*.35}s;transform-box:fill-box;transform-origin:center" d="M${x} ${y-6}L${x+1.6} ${y-1.6}L${x+6} ${y}L${x+1.6} ${y+1.6}L${x} ${y+6}L${x-1.6} ${y+1.6}L${x-6} ${y}L${x-1.6} ${y-1.6}Z" fill="#ffd36b"/>`});
svg.innerHTML=`<defs>${defs}</defs><circle class="glow" cx="150" cy="140" r="175" fill="url(#glow)"/><g class="sway">${leaves}${fill}${stems}${blooms}${wrap}</g>${sp}`;

const btn=document.getElementById('btn'),nameEl=document.getElementById('name'),msg=document.getElementById('msg');
function petals(){
  const cols=CONFIG.flowers.map(f=>f.petal).filter(c=>c!=='#ffffff');
  for(let k=0;k<34;k++){const d=document.createElement('div');d.className='fp';
    d.style.left=Math.random()*100+'vw';d.style.background=cols[k%cols.length];
    d.style.setProperty('--dx',(Math.random()*160-80)+'px');d.style.setProperty('--rot',(Math.random()*720-360)+'deg');
    d.style.animationDuration=(6+Math.random()*6)+'s';d.style.animationDelay=(Math.random()*3)+'s';
    document.body.appendChild(d);setTimeout(()=>d.remove(),14000)}
}
btn.addEventListener('click',()=>{
  btn.style.display='none';petals();
  nameEl.textContent=CONFIG.name;
  requestAnimationFrame(()=>{document.getElementById('to').classList.add('show');nameEl.classList.add('show');});
  CONFIG.message.forEach((t,i)=>{
    const p=document.createElement('p');p.textContent=t;msg.appendChild(p);
    setTimeout(()=>p.classList.add('show'),1400+i*1800);
  });
});
</script>
</body>
</html>
